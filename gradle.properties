android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
org.gradle.parallel=false
systemProp.java.net.preferIPv4Stack=true
# Gradle 8.9 is pinned deliberately in this VM (8.14.3 cannot build here, see
# AGENTS.md / build.sh), so silence only that version's deprecation notice.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
# The Kotlin compile daemon cannot run in this VM (its loopback TCP is
# intercepted and the build used to warn "Failed to compile with Kotlin
# daemon" before falling back). Compile in-process from the start.
kotlin.compiler.execution.strategy=in-process
